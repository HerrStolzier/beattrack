[project]
name = "beattrack-api"
version = "0.1.0"
description = "Beattrack API — sonically similar song finder"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "pydantic>=2.13.4",
    "supabase>=2.31.0",
    "python-magic>=0.4.27",
    "slowapi>=0.1.10",
    "procrastinate[asyncio]>=2.0.0",
    "sse-starlette>=3.4.6",
    "python-multipart>=0.0.20",
    "numpy>=2.5.1",
    "essentia>=2.1b6.dev1110",
    "essentia-tensorflow>=2.1b6.dev1110",
    "pyacoustid>=1.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "pip-audit>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "UP", "RUF"]
ignore = ["S101", "S603", "S607"]  # assert in tests, subprocess calls are intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (skipped unless essentia is installed)",
]
